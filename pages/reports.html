<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Reports - Enterprise Accessible Dashboard demo">
<title>Reports | Enterprise Accessible Dashboard</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="stylesheet" href="../css/responsive.css">
<link rel="stylesheet" href="../css/accessibility.css">
</head>
<body data-root="../">
<a class="skip-link" href="#main">Skip to main content</a>
<div data-include="header"></div>
<div class="layout">
<div data-include="sidebar"></div>
<main id="main" tabindex="-1">
<h1>Reports</h1>
<section aria-labelledby="rs-h">
<h2 id="rs-h">Report summary</h2>
<dl class="summary"><dt>Records shown</dt><dd id="r-count">0</dd><dt>Total value</dt><dd id="r-total">0</dd></dl>
</section>
<section aria-labelledby="rf-h">
<h2 id="rf-h">Filters</h2>
<form id="rform" aria-labelledby="rf-h" class="filters">
<p><label for="from">From date</label><input id="from" type="date"></p>
<p><label for="to">To date</label><input id="to" type="date"></p>
<p><label for="cat">Category</label><select id="cat"><option value="">All categories</option><option>Logins</option><option>Registrations</option><option>Exports</option></select></p>
<p class="actions"><button type="button" id="export" class="btn primary">Export CSV</button> <button type="reset" class="btn">Clear filters</button></p>
</form>
<p id="r-msg" role="status"></p>
</section>
<section aria-labelledby="rd-h">
<h2 id="rd-h">Report data</h2>
<div class="table-wrap" tabindex="0" role="region" aria-labelledby="rd-h">
<table>
<caption>Activity report by category</caption>
<thead><tr><th scope="col">Date</th><th scope="col">Category</th><th scope="col">Description</th><th scope="col">Value</th></tr></thead>
<tbody id="rrows"></tbody>
</table>
</div>
</section>
</main>
</div>
<div data-include="footer"></div>
<script src="../js/main.js"></script>
<script src="../js/navigation.js"></script>
<script src="../js/modal.js"></script>
<script src="../js/reports.js"></script>
</body>
</html>
